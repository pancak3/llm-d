apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ms-kv-events-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ms-kv-events-node-reader-binding
subjects:
  - kind: ServiceAccount
    name: ms-kv-events-llm-d-modelservice
    namespace: llm-d-precise
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ms-kv-events-node-reader