multinode: false

accelerator:
  disableDefaultResource: true

routing:
  servicePort: 8000
  proxy:
    enabled: false
    image: ghcr.io/llm-d/llm-d-routing-sidecar:v0.3.0
    connector: nixlv2
    secure: false

  inferencePool:
    create: false

  httpRoute:
    create: false

  epp:
    create: false

modelArtifacts:
  name: "Qwen/Qwen3-0.6B"


decode:
  create: true
  replicas: 6
  monitoring:
    podmonitor:
      enabled: true
      portName: "metrics"  # decode vLLM service port (from routing.proxy.targetPort)
      path: "/metrics"
      interval: "30s"
  extraConfig:
  #   nodeSelector:
  #     llm-infer.qifand.com/infer-instances: "2"
  #   topologySpreadConstraints:
  #     - maxSkew: 2
  #       topologyKey: kubernetes.io/hostname
  #       whenUnsatisfiable: DoNotSchedule
  #       labelSelector:
  #         matchLabels:
  #           llm-d.ai/role: decode
    initContainers:
      - name: routing-proxy
        args:
          - --port=8000
          - --vllm-port=8200
          - --connector=nixlv2
          - -v=5
          - --secure-proxy=false
        image: ghcr.io/llm-d/llm-d-routing-sidecar:v0.3.0
        imagePullPolicy: Always
        ports:
          - containerPort: 8000
        resources:
          requests:
            ephemeral-storage: "20G"
          limits:
            ephemeral-storage: "20G"
        restartPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
      - name: fetch-datacenter-label
        image: docker.io/alpine/k8s:1.28.2
        command:
          - /bin/sh
          - -c
          - |
            NODE_NAME="${POD_NODE_NAME:-}"
            if [ -z "$NODE_NAME" ]; then
              echo "" > /podinfo/datacenter_label
              exit 0
            fi
            # use kubectl (rest client configured via serviceaccount) to read the node label
            kubectl get node "$NODE_NAME" -o jsonpath='{.metadata.labels.llm-infer\.qifand\.com/datacenter-cluster}' > /podinfo/datacenter_label || echo "" > /podinfo/datacenter_label
            # get the k8s internal ip
            INTERNAL_IP=$(kubectl get node "$NODE_NAME" -o jsonpath='{.status.addresses[?(@.type=="InternalIP")].address}')
            echo "$INTERNAL_IP" > /nodeinfo/internal_ip
            # get the svc nodeport
            SVC_NODE_PORT=$(kubectl get svc infra-kv-events-inference-gateway-istio -o jsonpath='{.spec.ports[?(@.port==80)].nodePort}')
            echo "$SVC_NODE_PORT" > /nodeinfo/svc_node_port
        env:
          - name: POD_NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
        volumeMounts:
          - name: podinfo
            mountPath: /podinfo
          - name: nodeinfo
            mountPath: /nodeinfo
  containers:
  - name: "vllm"
    image: harbor.qifand.com/llm-infer/vllm-openai:latest
    imagePullPolicy: Always
    securityContext:
        privileged: true
        capabilities:
          # add: ["IPC_LOCK", "NET_ADMIN"]
          add: ["IPC_LOCK"]
    shm_size: "100Gi"
    modelCommand: custom
    command:
      - /bin/bash
      - '-c'
    args:
      - /usr/local/bin/run.sh
    env:
      - name: GAIE_RELEASE_NAME_POSTFIX # index 0 matters because of set in helmfile
      - name: NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace # assumed to be the same as the EPP's
      - name: PYTHONHASHSEED
        value: "42"
      - name: POD_IP
        valueFrom:
          fieldRef:
            apiVersion: v1
            fieldPath: status.podIP
      - name: CUDA_VISIBLE_DEVICES
        value: "0"
      - name: VLLM_NIXL_SIDE_CHANNEL_HOST
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: VLLM_NIXL_SIDE_CHANNEL_PORT
        value: "5557"
      - name: INFERENCE_DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: postgresql-credential
            key: admin-password
      - name: INFERENCE_DB_URL
        value: "postgresql-cluster-rw.postgresql.svc.cluster.local"
      - name: INFERENCE_DB_USERNAME
        value: "admin"
      - name: INFERENCE_DB_NAME
        value: "logsdb"
      - name: INFERENCE_DB_SCHEMA
        value: "metrics"
      - name: INFERENCE_DB_TABLE
        value: "inference-instance"
      - name: INFERENCE_DB_PORT
        value: "5432"
      - name: KV_CONNECTOR
        # value: "NixlConnector"
        value: "LMCacheConnectorV1"
      - name: HF_HOME
        value: "/model-cache"
      # - name: LMCACHE_CONTROLLER_ADDR_PULL
      #   value: "lmcache-controller.{{ .Release.Namespace }}.svc.cluster.local:28300"
      # - name: LMCACHE_CONTROLLER_ADDR_REPLY
      #   value: "lmcache-controller.{{ .Release.Namespace }}.svc.cluster.local:28400"
      # - name: UCX_TLS
      #   value: "tcp"
      - name: NCCL_P2P_DISABLE # solve vllm hang issue in some environments
        value: "1"
      - name: HF_MODEL
        value: "Qwen/Qwen3-0.6B"
      - name: LMCACHE_ENABLE_CONTROLLER
        value: "false"
      - name: LMCACHE_ENABLE_P2P
        value: "false"
      - name: LMCACHE_ENABLE_ASYNC_LOADING
        value: "false"
      - name: LMCACHE_CHUNK_SIZE
        value: "8"
      - name: LMCACHE_MAX_LOCAL_CPU_SIZE
        value: "120" # Gi
      - name: LMCACHE_USE_EXPERIMENTAL
        value: "true"
      - name: LMCACHE_LOCAL_DISK
        value: "file:///lmcache"
      - name: LMCACHE_MAX_LOCAL_DISK_SIZE
        value: "480" # Gi
      - name: MAX_MODEL_LEN
        value: "256"
      # - name: QUANTIZATION
      #   value: "fp8"
      # - name: KV_CACHE_DTYPE
      #   value: "fp8_e4m3"
      - name: MAX_NUM_SEQS
        value: "512"
      # - name: MAX_NUM_BATCHED_TOKENS
      #   value: "4096"
      - name: GPU_MEMORY_UTILIZATION
        value: "0.85"
      # - name: KV_CACHE_MEMORY
      #   value: "1024000" # 40GB 42949672960
      #### DEBUG ENV VARS
      - name: VLLM_LOGGING_LEVEL
        value: "DEBUG"
      # - name: CUDA_LAUNCH_BLOCKING
      #   value: "1"
      # - name: NCCL_DEBUG
      #   value: "TRACE"
      # - name: VLLM_TRACE_FUNCTION
      #   value: "1"
    ports:
      - containerPort: 5557
        protocol: TCP
      - containerPort: 8200
        name: metrics
        protocol: TCP
    resources:
      limits:
        # ephemeral-storage: "200Gi"
        memory: "150Gi"
        nvidia.com/gpu: 1
      requests:
        # ephemeral-storage: "200Gi"
        memory: "150Gi"
        nvidia.com/gpu: 1
    # disable chart's built-in model volume creation so we can mount the existing PVC
    mountModelVolume: false
    volumeMounts:
    - name: metrics-volume
      mountPath: /.config
    - name: torch-compile-cache
      mountPath: /.cache
    - name: podinfo
      mountPath: /podinfo
    - name: nodeinfo
      mountPath: /nodeinfo
    - name: model-storage-hostpath
      mountPath: /model-cache
    - name: lmcache-storage-hostpath
      mountPath: /lmcache
    - name: vllm-cache-hostpath
      mountPath: /root/.cache/vllm/
  volumes:
  - name: metrics-volume
    emptyDir: {}
  - name: torch-compile-cache
    emptyDir: {}
  - name: podinfo
    emptyDir: {}
  - name: nodeinfo
    emptyDir: {}
  - name: model-storage-hostpath
    hostPath:
      path: /mnt/model-cache
      type: Directory
  - name: lmcache-storage-hostpath
    hostPath:
      path: /mnt/lmcache
      type: Directory
  - name: vllm-cache-hostpath
    hostPath:
      path: /mnt/vllm-cache
      type: Directory
# PD disabled in this example
prefill:
  create: false

extraObjects:
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: "{{ include \"llm-d-modelservice.fullname\" . }}-node-reader"
    rules:
      - apiGroups: [""]
        resources: ["nodes", "services"]
        verbs: ["get", "list"]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: "{{ include \"llm-d-modelservice.fullname\" . }}-node-reader-binding"
    subjects:
      - kind: ServiceAccount
        name: "{{ include \"llm-d-modelservice.pdServiceAccountName\" . }}"
        namespace: "{{ .Release.Namespace }}"
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: "{{ include \"llm-d-modelservice.fullname\" . }}-node-reader"
